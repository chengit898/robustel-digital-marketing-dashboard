<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robustel Digital Marketing Story</title>
<style>
:root{
  --ink:#16283a;--muted:#617487;--line:#dbe5ec;--panel:#fff;--bg:#f4f7f9;
  --blue:#0b70d1;--cyan:#168daa;--green:#168164;--amber:#a96810;--red:#b44343;
  --violet:#6758c7;--nav:#102a43;--soft-blue:#eaf4ff;--soft-green:#e9f6f1;
  --soft-amber:#fff5e5;--soft-red:#fff0f0;--shadow:0 10px 28px rgba(16,42,67,.07)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,Segoe UI,Arial,sans-serif}
button,input,select{font:inherit}
a{color:var(--blue)}
.shell{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}
.sidebar{background:var(--nav);color:#fff;padding:25px 18px;position:sticky;top:0;height:100vh}
.brand{padding:0 10px 24px;border-bottom:1px solid rgba(255,255,255,.14)}
.brand b{display:block;font-size:18px;letter-spacing:.2px}.brand span{color:#b8cad9;font-size:12px}
.nav{display:grid;gap:6px;margin-top:24px}
.nav button{border:0;background:transparent;color:#c5d4df;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer}
.nav button:hover,.nav button.active{background:rgba(255,255,255,.12);color:#fff}
.nav small{display:block;color:#8fa6b8;margin:24px 10px 7px;text-transform:uppercase;letter-spacing:.08em}
.side-note{position:absolute;bottom:22px;left:18px;right:18px;color:#a9bdcc;font-size:11px}
.main{min-width:0}
.topbar{height:76px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}
.topbar h1{font-size:20px;margin:0}.topbar p{margin:2px 0 0;color:var(--muted);font-size:12px}
.top-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.content{padding:26px 30px 44px;max-width:1600px;margin:auto}
.view{display:none}.view.active{display:block}
.page-intro{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}
.page-intro h2{margin:0 0 5px;font-size:25px}.page-intro p{margin:0;color:var(--muted);max-width:850px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:600;background:#edf2f5;color:#496071;white-space:nowrap}
.badge.good{background:var(--soft-green);color:var(--green)}.badge.warn{background:var(--soft-amber);color:var(--amber)}.badge.danger{background:var(--soft-red);color:var(--red)}.badge.blue{background:var(--soft-blue);color:var(--blue)}
.story{background:linear-gradient(120deg,#0d4676,#0b70d1 68%,#168daa);color:#fff;padding:24px 26px;border-radius:15px;box-shadow:var(--shadow);margin-bottom:18px}
.story .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#c9e5ff}.story h3{font-size:22px;line-height:1.35;margin:8px 0}.story p{margin:0;color:#e3f1fb;max-width:1000px}
.mtd{border-left:4px solid var(--amber);background:var(--soft-amber);padding:12px 14px;margin-bottom:18px;border-radius:0 8px 8px 0;color:#70470b}
.grid{display:grid;gap:15px}.grid.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow);min-width:0}
.kpi{box-shadow:none}.kpi .label{font-size:12px;color:var(--muted)}.kpi .value{font-size:27px;font-weight:700;margin:7px 0 3px;letter-spacing:-.02em}.kpi .delta{font-size:12px;color:var(--muted)}.up{color:var(--green)!important}.down{color:var(--red)!important}
.section{margin-top:22px}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:10px}.section-head h3{font-size:17px;margin:0}.section-head p{margin:2px 0 0;color:var(--muted);font-size:12px}
.chart{min-height:220px}.chart svg{width:100%;height:auto;display:block}.axis{stroke:#c9d5de;stroke-width:1}.gridline{stroke:#e8eef2;stroke-width:1}.chart-label{fill:#617487;font-size:10px}.chart-value{fill:#16283a;font-size:10px;font-weight:600}
.movement{display:grid;gap:10px}.movement-row{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center}.track{height:12px;background:#eef3f6;border-radius:99px;overflow:hidden;position:relative}.fill{height:100%;border-radius:99px;background:var(--blue)}.fill.neg{background:var(--red)}
.finding{border-top:3px solid var(--blue)}.finding.supported{border-color:var(--amber)}.finding.hypothesis{border-color:var(--violet)}.finding h4{margin:9px 0 6px}.finding p{margin:5px 0;color:var(--muted)}.finding dl{margin:10px 0 0}.finding dt{font-size:11px;color:var(--muted);text-transform:uppercase}.finding dd{margin:2px 0 8px}
.table-wrap{overflow-x:auto}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:10px;border-bottom:1px solid var(--line)}.table td{padding:11px 10px;border-bottom:1px solid #edf1f4;vertical-align:top}.table td.num,.table th.num{text-align:right;font-variant-numeric:tabular-nums}.table tr:last-child td{border-bottom:0}
.funnel{display:flex;align-items:stretch;gap:8px;overflow-x:auto;padding:4px 2px 12px}.funnel-node{min-width:180px;flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:var(--shadow)}.funnel-node .stage{font-size:11px;text-transform:uppercase;color:var(--muted)}.funnel-node .big{font-size:25px;font-weight:700;margin:5px 0}.funnel-node p{color:var(--muted);font-size:11px;margin:8px 0 0}.connector{min-width:38px;display:grid;place-items:center;color:var(--green);font-size:24px}.connector.aggregate{color:var(--amber)}.connector span{border-top:2px solid currentColor;width:28px;position:relative}.connector.aggregate span{border-top-style:dashed}.connector span:after{content:"";position:absolute;right:-1px;top:-5px;border-left:7px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent}
.mini-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.mini-chart h4{font-size:13px;margin:0}.mini-chart .mini-value{font-size:20px;font-weight:700;margin-top:3px}.mini-chart svg{width:100%;height:80px;margin-top:8px}
.bars{display:grid;gap:9px}.bar-row{display:grid;grid-template-columns:minmax(110px,1.3fr) 2fr 65px;gap:9px;align-items:center}.bar-row label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar-track{height:9px;border-radius:99px;background:#edf2f5;overflow:hidden}.bar-fill{height:100%;background:var(--cyan);border-radius:99px}
.radar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.radar-col{border-top:4px solid var(--line);padding-top:10px}.radar-col.rising{border-color:var(--green)}.radar-col.watch{border-color:var(--amber)}.radar-col.declining{border-color:var(--red)}.radar-col h4{margin:0 0 8px}.radar-item{padding:10px 0;border-bottom:1px solid var(--line)}.radar-item b{display:block}.radar-item span{font-size:11px;color:var(--muted)}
.event{padding:14px 0;border-bottom:1px solid var(--line)}.event:last-child{border:0}.event h4{margin:5px 0}.event p{margin:5px 0;color:var(--muted)}.event-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.source-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.source{border-left:3px solid var(--blue);padding-left:12px}.source h4{margin:0 0 4px}.source p{margin:2px 0;color:var(--muted);font-size:12px}
.quality{display:grid;gap:8px}.quality-row{display:grid;grid-template-columns:180px 110px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}

@media(max-width:1180px){.grid.kpis{grid-template-columns:repeat(3,1fr)}.mini-grid{grid-template-columns:repeat(2,1fr)}.radar{grid-template-columns:repeat(2,1fr)}}

</style>
</head>

const deltaHtml=change=>{

};
const table=(headers,rows)=>{
  if(!rows||!rows.length)return '<p class="muted">No comparable data available.</p>';
  return `<div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th class="${h.num?'num':''}">${esc(h.label)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${headers.map(h=>`<td class="${h.num?'num':''}">${h.render?h.render(r):esc(r[h.key]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

const kpi=(label,value,change,note)=>`<article class="card kpi"><div class="label">${esc(label)}</div><div class="value">${value}</div><div class="delta">${change||''}</div>${note?`<div class="small muted mt">${esc(note)}</div>`:''}</article>`;
const lineMini=(rows,key,label)=>{
  const values=rows.map(r=>r[key]).filter(v=>v!==null&&v!==undefined).map(n);
  if(values.length<2)return '<p class="muted small">Insufficient monthly history.</p>';
  const max=Math.max(...values,1),min=Math.min(...values),range=Math.max(max-min,1);
  const points=rows.map((r,i)=>{
    if(r[key]===null||r[key]===undefined)return null;
    return `${8+i*(184/Math.max(rows.length-1,1))},${70-((n(r[key])-min)/range)*55}`;
  }).filter(Boolean).join(' ');
  return `<svg viewBox="0 0 200 82" role="img" aria-label="${esc(label)} monthly trend"><line x1="7" y1="71" x2="193" y2="71" class="axis"/><polyline points="${points}" fill="none" stroke="var(--blue)" stroke-width="2.5"/><circle cx="${points.split(' ').at(-1)?.split(',')[0]||193}" cy="${points.split(' ').at(-1)?.split(',')[1]||70}" r="3.5" fill="var(--blue)"/></svg>`;

const movementChart=stages=>{
  const comparable=stages.filter(s=>s.change&&s.change.rate!==null&&s.change.rate!==undefined);
  if(!comparable.length)return '<p class="muted">No complete-month comparison is available.</p>';
  const max=Math.max(...comparable.map(s=>Math.abs(n(s.change.rate))),.01);
  return `<div class="movement">${comparable.map(s=>{const rate=n(s.change.rate);return `<div class="movement-row"><b>${esc(s.label)}</b><div class="track"><div class="fill ${rate<0?'neg':''}" style="width:${Math.max(3,Math.abs(rate)/max*100)}%"></div></div><span class="${rate>=0?'up':'down'}">${signed(rate*100)}</span></div>`}).join('')}</div>`;
};
const barList=rows=>{
  if(!rows||!rows.length)return '<p class="muted">No segment comparison available.</p>';

    {label:'Spend · 30d',num:true,render:r=>money(r.cost)},{label:'Clicks',num:true,render:r=>fmt(r.clicks)},{label:'Sessions',num:true,render:r=>fmt(r.sessions)},
    {label:'Engaged',num:true,render:r=>fmt(r.engaged_sessions)},{label:'MQL · YTD',num:true,render:r=>fmt(r.mql_ytd)},{label:'Signal',render:r=>badge(r.signal,r.signal_class==='good'?'good':r.signal_class==='warning'?'warn':'')}
  ];
  const leadHeaders=[
    {label:'Industry',key:'Industry Group'},{label:'Inquiries',num:true,render:r=>fmt(r.Inquiries)},{label:'Share',num:true,render:r=>pct(r.Share)}
  ];
  const queryHeaders=[
    {label:'Query',key:'query'},{label:'Clicks',num:true,render:r=>fmt(r.clicks)},{label:'Impressions',num:true,render:r=>fmt(r.impressions)},{label:'CTR',num:true,render:r=>pct(r.ctr)},{label:'Position',num:true,render:r=>n(r.position).toFixed(1)}
  ];
  const lineage=[
    ['Google Ads','Read-only API + report bundle',DATA.ads_monthly.period,'Weekly','Aggregate only','No GCLID/lead-level linkage'],
    ['GA4','Read-only Data API',a.date_range,'Weekly','Aggregate only','Form tracking begins during 2026'],
    ['GSC','Restricted read-only API',DATA.gsc_monthly.period,'Weekly','Owned search only','Search visibility is not total market demand'],
    ['CRM / MQL','Manual aggregate replacement',{start:m.summary.date_min,end:m.summary.date_max},'Monthly','Lead ID within CRM exports','Sales updates may restate history'],
    ['SEMrush','Manual export',{start:s.exported_at,end:s.exported_at},'Monthly','External directional signal','Volume, CPC and KD are estimates'],
    ['LinkedIn','Manual aggregate export',{start:'2025-07',end:'2026-07'},'Monthly','Channel aggregate','Competitors not normalized for audience size'],
    ['Industry news','Codex-curated official sources',{start:DATA.market_events.snapshot_period,end:DATA.market_events.snapshot_period},'Monthly','External context','Implications are marketing judgment']
  ];
  const lineageHeaders=[
    {label:'Source',render:r=>`<b>${esc(r[0])}</b>`},{label:'Method',render:r=>esc(r[1])},{label:'Coverage',render:r=>esc(`${r[2]?.start||''} → ${r[2]?.end||''}`)},
    {label:'Refresh',render:r=>esc(r[3])},{label:'Attribution',render:r=>esc(r[4])},{label:'Limitation',render:r=>esc(r[5])}
  ];
  const quality=[
    ['Complete-month default',mm.complete_period,'Pass','MTD is separated from formal MoM comparison.'],
    ['Google Ads calendar months',DATA.ads_monthly.status,DATA.ads_monthly.status==='live'?'Pass':'Limited','30-day bundle remains available when calendar-month API is unavailable.'],
    ['GA4 form success','Partial history','Limited','generate_lead is zero before tracking was introduced; older months are not equivalent.'],
    ['Lead-level attribution','Unavailable','Open gap','No GCLID and no lead_tracking_id.'],
    ['CRM history revision',mm.revisions?.length?'Detected':'Not detected','Monitor','Monthly snapshots will flag later sales updates.'],
    ['Privacy scan','Aggregate only','Pass','No raw lead rows, credentials, customer ID or service-account details in HTML.']
  ];
  $('#view-evidence').innerHTML=`
    <div class="page-intro"><div><h2>Evidence &amp; Data Quality</h2><p>Detailed diagnostics are retained here so the executive pages remain focused on decisions.</p></div>${badge('Privacy-safe','good')}</div>
    <nav class="subnav"><a href="#countries">Countries</a><a href="#paid">Paid Search</a><a href="#leads">Leads &amp; Industries</a><a href="#organic">Organic &amp; Social</a><a href="#lineage">Source Lineage</a><a href="#quality">Data Quality</a></nav>
    <section class="card" id="countries"><div class="section-head"><div><h3>Countries</h3><p>${esc(c.note||'')}</p></div>${badge(c.status||'Unavailable',c.status==='live'?'good':'warn')}</div>${table(countryHeaders,(c.rows||[]).slice(0,30))}</section>
    <section class="grid two section" id="paid"><div class="card"><h3>Paid Search summary</h3><div class="quality"><div class="quality-row"><b>Spend</b><span>${money(a.summary?.account?.cost||a.account?.cost)}</span><span>${esc(a.date_range?.start||'')} → ${esc(a.date_range?.end||'')}</span></div><div class="quality-row"><b>Clicks</b><span>${fmt(a.summary?.account?.clicks||a.account?.clicks)}</span><span>Read-only</span></div><div class="quality-row"><b>CTR</b><span>${pct(a.summary?.account?.ctr||a.account?.ctr)}</span><span>Operational metric</span></div></div></div><div class="card"><h3>Negative-keyword review</h3>${table([{label:'Candidate',key:'target'},{label:'Match',key:'match_type'},{label:'Campaign',key:'campaign'}],(a.recommendations||[]).filter(r=>r.category==='negative').slice(0,12))}</div></section>
    <section class="grid two section" id="leads"><div class="card"><h3>Leads &amp; industries</h3>${table(leadHeaders,(m.industries||[]).slice(0,15))}</div><div class="card"><h3>Demand themes</h3>${barList((m.demand_themes||[]).slice(0,12).map(r=>({label:r['Primary Demand Theme'],current:n(r.Inquiries),previous:0,change:n(r.Inquiries)})))}</div></section>
    <section class="grid two section" id="organic"><div class="card"><h3>Organic search</h3>${table(queryHeaders,(g.queries||[]).slice(0,15))}</div><div class="card"><h3>LinkedIn monthly trend</h3><div class="mini-grid">${[['impressions_total','Impressions'],['clicks_total','Clicks'],['total_followers','New followers'],['overview_unique_visitors_total','Unique visitors']].map(([key,label])=>`<div class="mini-chart"><h4>${label}</h4>${lineMini(l.monthly||[],key,label)}</div>`).join('')}</div></div></section>
    <section class="card section" id="lineage"><div class="section-head"><div><h3>Source lineage</h3><p>How each source enters the business story and what it can legitimately prove.</p></div></div>${table(lineageHeaders,lineage)}</section>
    <section class="card section" id="quality"><div class="section-head"><div><h3>Data quality</h3><p>Limitations that could change interpretation.</p></div></div><div class="quality">${quality.map(q=>`<div class="quality-row"><b>${esc(q[0])}</b><span>${badge(q[2],q[2]==='Pass'?'good':q[2]==='Open gap'?'danger':'warn')}</span><span><b>${esc(q[1])}</b><br><span class="muted small">${esc(q[3])}</span></span></div>`).join('')}</div></section>`;
}
function renderAll(){
  renderExecutive();renderFunnel();renderMonthly();renderMarket();renderEvidence();
  $('#freshness').textContent=`Built ${new Date(DATA.meta.generated_at).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'})} · complete month ${DATA.monthly_model.complete_period} · MTD ${DATA.monthly_model.mtd_period}`;
}
$('#nav').addEventListener('click',event=>{
  const button=event.target.closest('button[data-view]');if(!button)return;
  $$('#nav button').forEach(item=>item.classList.toggle('active',item===button));
  $$('.view').forEach(item=>item.classList.remove('active'));
  $(`#view-${button.dataset.view}`).classList.add('active');
  $('#pageTitle').textContent=button.textContent.trim();window.scrollTo({top:0,behavior:'smooth'});
});
$('#printBtn').addEventListener('click',()=>window.print());
$('#exportBtn').addEventListener('click',()=>{
  const rows=DATA.country_funnel.rows||[];
  const cols=['country','market_priority','cost','clicks','sessions','engaged_sessions','engagement_rate','key_events','mql_ytd','signal','next_action'];
  const csv=[cols.join(','),...rows.map(r=>cols.map(c=>`"${String(r[c]??'').replace(/"/g,'""')}"`).join(','))].join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),link=document.createElement('a');
  link.href=URL.createObjectURL(blob);link.download='robustel-country-evidence.csv';link.click();URL.revokeObjectURL(link.href);
});
renderAll();
</script>

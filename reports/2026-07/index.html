<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Robustel July 2026 Report</title><style>
    body{margin:0;background:#eef3f7;color:#172033;font:15px/1.6 'Segoe UI',Arial,sans-serif}.wrap{max-width:1240px;margin:0 auto;padding:28px}.hero{background:linear-gradient(135deg,#005f8f,#00a6d6);color:white;border-radius:24px;padding:30px 34px;box-shadow:0 12px 34px rgba(0,95,143,.22)}.hero h1{margin:0 0 8px;font-size:32px}.hero p{margin:6px 0;color:#e9f7ff}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.tabs button,.linkbtn{border:1px solid #b9e5ff;background:white;color:#005f8f;border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer;text-decoration:none}.tabs button.active{background:#005f8f;color:white;border-color:#005f8f}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:18px 0}.card{background:white;border:1px solid #dce5ee;border-radius:18px;padding:18px;box-shadow:0 8px 28px rgba(23,32,51,.07)}.num{font-size:28px;font-weight:800}.pos{color:#2ead4b}.panel{display:none}.panel.active{display:block}iframe{width:100%;height:82vh;border:1px solid #dce5ee;border-radius:18px;background:white;box-shadow:0 8px 28px rgba(23,32,51,.07)}@media(max-width:900px){.cards{grid-template-columns:1fr}.wrap{padding:16px}iframe{height:76vh}}
    </style></head>
<body><main class="wrap">
<section class="hero"><h1>Robustel July 2026 Digital Marketing Report</h1><p>Default view: English. Use EN/ZH to switch language.</p></section>
<section class="cards"><div class="card"><div>MQL</div><div class="num pos">90</div><p>+45.2% MoM</p></div><div class="card"><div>Status</div><div class="num">Green</div><p>Management summary available in both language views.</p></div><div class="card"><div>Privacy</div><div class="num">OK</div><p>No raw email addresses are published.</p></div></section>
<section class="tabs"><button class="active" data-target="en">EN</button><button data-target="zh">ZH</button><a class="linkbtn" href="en/">Open EN</a><a class="linkbtn" href="zh/">Open ZH</a></section>
<section id="en" class="panel active"><iframe title="English report" src="en/"></iframe></section>
<section id="zh" class="panel"><iframe title="ZH report" src="zh/"></iframe></section>
</main><script>document.querySelectorAll('.tabs button').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));btn.classList.add('active');document.getElementById(btn.dataset.target).classList.add('active');});});</script></body></html>
